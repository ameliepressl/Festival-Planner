# Runs all automatic tests on every pull request and on every push to main.
# A green check in the pull request means all tests passed (see AGENTS.md).
# The Python tests were removed together with server.py (feature-plans/login.md).
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript tests
        run: node --test
